<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lecturer Login — DMISEU Chipata Campus</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>Lecturer Login</h1>
  </header>

  <main class="login-main">
    <form action="/api/lecturers/login" method="POST" class="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <button type="submit" class="btn-primary">Login</button>
      <p>Don’t have an account? <a href="/lecturer-register.html">Register here</a></p>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 DMISEU Chipata Campus</p>
  </footer>
</body>
</html>
