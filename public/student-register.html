<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Register — DMISEU Chipata Campus</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1>Student Registration</h1>
  </header>

  <main class="login-main">
    <form id="studentRegisterForm" class="login-form">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <label for="date_of_birth">Date of Birth</label>
      <input type="date" id="date_of_birth" name="date_of_birth">

      <label for="enrollment_date">Enrollment Date</label>
      <input type="date" id="enrollment_date" name="enrollment_date">

      <label for="department_id">Department</label>
      <input type="number" id="department_id" name="department_id" placeholder="Department ID">

      <button type="submit" class="btn-primary">Register</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 DMISEU Chipata Campus</p>
  </footer>
</body>
</html>
