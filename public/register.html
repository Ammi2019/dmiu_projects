<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — DMISEU Chipata Campus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-brand">
      <h1>DMISEU<br />Chipata Campus</h1>
      <hr class="rule" />
      <p>Student accounts get you access to enrollment and course records.</p>
    </div>
    <div class="auth-form-panel">
      <form class="auth-form" id="register-form">
        <h2>Create your account</h2>
        <p class="subtext">Staff accounts are set up by the department, not here.</p>

        <div class="message" id="message"></div>

        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" autocomplete="name" required />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required minlength="6" />
        </div>

        <div class="field">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required minlength="6" />
        </div>

        <button type="submit" class="btn-primary">Create account</button>

        <p class="switch-line">Already registered? <a href="/login.html">Sign in</a></p>
      </form>
    </div>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
