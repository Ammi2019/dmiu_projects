<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — DMISEU Chipata Campus</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="register-page">
  <header class="site-header">
    <h1>Create an Account</h1>
  </header>

  <main class="register-main">
    <form id="register-form" class="register-card apply-form-v2" novalidate>
      <fieldset class="portal-switch register-type">
        <legend>Registering as</legend>
        <label><input type="radio" name="account_type" value="student" checked> Student</label>
        <label><input type="radio" name="account_type" value="lecturer"> Lecturer</label>
        <label><input type="radio" name="account_type" value="staff"> Other staff</label>
      </fieldset>

      <div class="field">
        <label for="name">Full name <span class="req">*</span></label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="email">Email address <span class="req">*</span></label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <!-- Students only -->
      <div id="student-fields" class="student-fields">
        <div class="field">
          <label for="school">School <span class="req">*</span></label>
          <div class="select-wrap">
            <select id="school" name="school" required>
              <option value="">Loading schools…</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="programme">Programme <span class="req">*</span></label>
          <div class="select-wrap">
            <select id="programme" name="programme" required disabled>
              <option value="">Choose a school first</option>
            </select>
          </div>
          <p class="field-hint" id="programme-hint"></p>
        </div>
      </div>

      <!-- Lecturers only -->
      <div id="lecturer-fields" class="student-fields" hidden>
        <div class="field">
          <label for="lecturer-school">School you teach in <span class="req">*</span></label>
          <div class="select-wrap">
            <select id="lecturer-school" name="lecturer_school">
              <option value="">Loading schools…</option>
            </select>
          </div>
          <p class="field-hint">You will post assignments to students in this school.</p>
        </div>
      </div>

      <div class="field">
        <label for="password">Password <span class="req">*</span></label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
        <p class="field-hint">At least 8 characters.</p>
      </div>

      <div class="field">
        <label for="confirm-password">Confirm password <span class="req">*</span></label>
        <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required>
      </div>

      <button type="submit" class="btn-cta register-submit">
        <span class="btn-cta-label">Register</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
      <p id="message" class="message" role="alert"></p>
      <p class="register-alt">Already have an account? <a href="/login.html">Log in here</a></p>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 DMISEU Chipata Campus</p>
  </footer>

  <script src="/js/auth.js"></script>
</body>
</html>
