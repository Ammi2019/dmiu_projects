<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Administrator Register — DMISEU Chipata Campus</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>Administrator Registration</h1>
  </header>

  <main class="login-main">
    <form action="/api/admin/register" method="POST" class="login-form">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <label for="role">Role</label>
      <select id="role" name="role" required>
        <option value="administrator">Administrator</option>
        <option value="principal">Principal</option>
        <option value="dean_of_students">Dean of Students</option>
        <option value="accountant">Accountant</option>
        <option value="registry_clerk">Registry Clerk</option>
      </select>

      <button type="submit" class="btn-primary">Register</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 DMISEU Chipata Campus</p>
  </footer>
</body>
</html>
